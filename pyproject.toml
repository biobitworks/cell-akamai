[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cell-akamai-lane-a"
version = "0.1.0"
description = "Read-only vLLM inference telemetry, deterministic token kinetics, and evidence dashboard"
requires-python = ">=3.11"
dependencies = ["openai>=1.40", "requests>=2.31", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cell_akamai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
